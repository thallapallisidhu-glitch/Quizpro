<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizHub – Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="glass p-4 p-md-5 view" style="width:100%;max-width:460px">
    <div class="text-center mb-4">
      <i class="bi bi-mortarboard-fill" style="font-size:2.6rem"></i>
      <h3 class="fw-bold mt-2">QuizHub</h3>
      <p class="text-muted2 mb-0">Sign in to take or manage quizzes</p>
    </div>
    <ul class="nav nav-pills nav-fill mb-4">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tLogin">Login</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tSignup">Sign up</button></li>
    </ul>
    <div class="tab-content">
      <form class="tab-pane fade show active" id="tLogin">
        <div class="mb-3"><label class="form-label">Email</label><input type="email" id="lEmail" class="form-control" required></div>
        <div class="mb-4"><label class="form-label">Password</label><input type="password" id="lPass" class="form-control" required></div>
        <button class="btn btn-grad w-100 py-2">Login</button>
      </form>
      <form class="tab-pane fade" id="tSignup">
        <div class="mb-3"><label class="form-label">Full name</label><input id="sName" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Email</label><input type="email" id="sEmail" class="form-control" required></div>
        <div class="row g-2 mb-3">
          <div class="col-6"><label class="form-label">Password</label><input type="password" id="sPass" minlength="6" class="form-control" required></div>
          <div class="col-6"><label class="form-label">Confirm password</label><input type="password" id="sPass2" minlength="6" class="form-control" required></div>
        </div>
        <div class="mb-4"><label class="form-label">Role</label>
          <select id="sRole" class="form-select"><option value="student">Student</option><option value="admin">Admin</option></select></div>
        <button class="btn btn-grad w-100 py-2">Create account</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import {auth,db,toast} from "./js/common.js";
import {signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $ = id => document.getElementById(id);
let busy = false;
const go = async uid => {
  const s = await getDoc(doc(db,"users",uid));
  if (!s.exists()) return toast("Profile not found. Contact an admin.","danger");
  location.replace(s.data().role === "admin" ? "admin.html" : "student.html");
};
onAuthStateChanged(auth, u => { if (u && !busy) go(u.uid); });
const msg = e => ({"auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"That email is already registered.","auth/weak-password":"Password must be at least 6 characters."}[e.code] || e.message);

$("tLogin").onsubmit = async e => {
  e.preventDefault(); busy = true;
  try { const c = await signInWithEmailAndPassword(auth,$("lEmail").value.trim(),$("lPass").value); toast("Welcome back!"); await go(c.user.uid); }
  catch(err){ busy = false; toast(msg(err),"danger"); }
};
$("tSignup").onsubmit = async e => {
  e.preventDefault();
  if ($("sPass").value !== $("sPass2").value) return toast("Passwords do not match.","warning");
  busy = true;
  try {
    const c = await createUserWithEmailAndPassword(auth,$("sEmail").value.trim(),$("sPass").value);
    await updateProfile(c.user,{displayName:$("sName").value.trim()});
    await setDoc(doc(db,"users",c.user.uid),{name:$("sName").value.trim(),email:$("sEmail").value.trim(),role:$("sRole").value,createdAt:serverTimestamp()});
    toast("Account created!"); await go(c.user.uid);
  } catch(err){ busy = false; toast(msg(err),"danger"); }
};
</script>
</body>
</html>
